{% extends "base.html" %}
{% block title %}Create your pantry — Pantry List{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <h1>Set up your pantry</h1>
    <p class="sub">One account per household — everyone shares the same list.</p>

    <form method="POST" novalidate>
      <div class="field">
        <label for="name">Your name</label>
        <input type="text" id="name" name="name" value="{{ form.get('name', '') }}" required minlength="2">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ form.get('email', '') }}" required>
      </div>
      <div class="field">
        <label for="whatsapp_number">WhatsApp number <span style="text-transform:none;font-weight:400;">(optional, with country code)</span></label>
        <input type="text" id="whatsapp_number" name="whatsapp_number" placeholder="e.g. 919876543210" value="{{ form.get('whatsapp_number', '') }}" pattern="[0-9]*">
        <p class="hint">Digits only, no + or spaces. You can add this later too.</p>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required minlength="6">
      </div>
      <div class="field">
        <label for="confirm_password">Confirm password</label>
        <input type="password" id="confirm_password" name="confirm_password" required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary">Create account</button>
    </form>

    <p class="auth-switch">Already have a pantry? <a href="{{ url_for('login') }}">Sign in</a></p>
  </div>
</div>
{% endblock %}
